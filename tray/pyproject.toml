[project]
name = "status-badges"
dynamic = ["version"]
description = "Tray app with status badges for GitHub, PRTG, Docker, Bugsink and Dokploy"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Jakob Pless", email = "pless84@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "keyring>=24", "platformdirs>=4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
status-badges = "statusbadges.app:main"

[project.urls]
Source = "https://github.com/pless84/plasma-widgets"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statusbadges*"]

[tool.setuptools.dynamic]
version = { attr = "statusbadges.__version__" }

[tool.setuptools.package-data]
statusbadges = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
